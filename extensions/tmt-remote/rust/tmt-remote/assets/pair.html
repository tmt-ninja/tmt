    <title>Pair this browser · TMT</title>
    <link rel="stylesheet" href="/sdk/pages.css" />
    <script type="module" src="/sdk/shell.js"></script>
  </head>
  <body>
    <div class="tmt-ui-shell">
    <div class="tmt-ui-shell-content">
    <div class="tmt-ui-shell-bar">
    <header class="header tmt-ui-header" aria-label="Remote · Pair a browser">
      <h1 id="pairing-title" class="header-title tmt-ui-title">Pair a browser</h1>
    </header>
    </div>
    <div class="tmt-ui-shell-main">
    <main class="tmt-page">
      <section
        id="notice"
        class="sheet tmt-ui-notice"
        data-tone="waiting"
        aria-labelledby="heading"
      >
        <div class="sheet-body tmt-ui-notice-body">
          <div class="tmt-ui-notice-mark">
            <span id="mark" class="state-mark" aria-hidden="true">◆</span
            ><span id="state-label">Initializing</span>
          </div>
          <p id="pairing-eyebrow" class="eyebrow tmt-ui-notice-eyebrow">Browser pairing</p>
          <h2 id="heading" class="tmt-ui-notice-heading">Pair this browser with tmt remote</h2>
          <form id="pair">
            <div class="tmt-ui-field">
              <label id="name-label" class="tmt-ui-field-label" for="name">Device name</label>
              <input
                id="name"
                class="tmt-ui-field-control"
                aria-labelledby="name-label"
                maxlength="64"
                required
                value="Browser"
              />
            </div>
            <button class="tmt-ui-action" type="submit" aria-describedby="status" disabled>
              <span class="tmt-ui-action-label">Pair</span>
            </button>
          </form>
          <div id="comparison" role="region" aria-labelledby="words-label" aria-describedby="status" tabindex="-1" hidden>
            <p id="words-label" class="words-label">Four words to compare</p>
            <p id="words"></p>
          </div>
          <p id="status" role="status" tabindex="-1">Pairing is unavailable until a pairing link is ready.</p>
          <p id="entry-link" hidden><a href="/remote/overview">Return to Remote and connect</a></p>
        </div>
      </section>
    </main>
    </div>
    </div>
    </div>
  </body>
