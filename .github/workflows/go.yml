# Go port CI (#6938). Lives only on poc/go; main never carries this file.
#
# Runner budget (shared Team cap with main/PR CI): every push gets exactly one
# ubuntu job (check + build + test, about 1 min). dist runs only for the newest
# head. The race detector and macOS run only on workflow_dispatch, which the
# lead triggers at milestones; the race build of modernc.org/sqlite needs
# about 7 min locally for storage alone.
name: go
on:
  push:
    branches: [poc/go]
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
      - 'rust/crates/tmt-adapters/src/storage/schema/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: check
        if: runner.os == 'Linux'
        run: |
          start=$(date +%s)
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags nativecompat ./...
          sh scripts/check-schema-copy.sh
          echo "check: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y tmux >/dev/null; else brew install tmux >/dev/null; fi
          tmux -V
      - name: build
        run: |
          start=$(date +%s)
          go build ./...
          echo "${{ matrix.os }} build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: test
        run: |
          start=$(date +%s)
          env -u TMUX -u TMUX_PANE go test -count=1 -timeout 8m ./...
          echo "${{ matrix.os }} test: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

  race:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: tmux
        run: sudo apt-get install -y tmux >/dev/null
      - name: race
        run: |
          start=$(date +%s)
          env -u TMUX -u TMUX_PANE go test -race -count=1 -timeout 25m ./...
          echo "race: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

  # Only the newest head needs installable artifacts (tmt-go upgrade takes the
  # newest successful run), so older dist jobs are cancelled.
  dist:
    needs: [test]
    concurrency:
      group: go-dist-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: cross-build
        run: |
          version="0.0.0-go.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::10}"
          mkdir -p dist
          # Two flavors per target: isolated tmt-go, and the native-compatible
          # tmt (-tags nativecompat) that replaces native after merge.
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/tmt-ninja/tmt/go/internal/cli.Version=$version" \
              -o "dist/tmt-go-$os-$arch" ./cmd/tmt-go
            GOOS=$os GOARCH=$arch go build -trimpath -tags nativecompat \
              -ldflags "-s -w -X github.com/tmt-ninja/tmt/go/internal/cli.Version=$version" \
              -o "dist/tmt-$os-$arch" ./cmd/tmt-go
          done
          (cd dist && sha256sum tmt-go-* tmt-darwin-* tmt-linux-* > SHA256SUMS)
          ls -l dist >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tmt-go
          path: go/dist/
          retention-days: 14

  typescript-parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the replacement CLI
        run: |
          mkdir -p "$RUNNER_TEMP/tmt-go-parity/bin" "$RUNNER_TEMP/tmt-go-parity/reports"
          go build -trimpath -tags nativecompat -o "$RUNNER_TEMP/tmt-go-parity/bin/tmt" ./cmd/tmt-go
      - name: Configure the hosted Docker mirror
        uses: ./.github/actions/setup-docker-mirror
      - name: Build the existing native E2E image
        working-directory: .
        run: |
          image="tmt-go-parity:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$image" --build-arg TMT_E2E_ADAPTER_TESTS=0 --file typescript/test/e2e/Dockerfile .
      - name: Run unchanged TypeScript cases on both executables
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from collections import Counter
          from pathlib import Path

          # One list selects the suite cases and defines the expected counts.
          cases = {
              "native": [
                  ("test/native/api.test.ts", "ends an incomplete session frame after publishing only the preceding complete response"),
                  ("test/native/api.test.ts", "bounds incomplete and oversized input before opening storage"),
                  ("test/native/extension-command.test.ts", "executes the exact tail, preserves stdin/output/exit and exposes the invoking executable"),
                  ("test/native/check.test.ts", "distinguishes renamed-away names from existing inactive identities with exit 3"),
                  ("test/native/check.test.ts", "validates configuration before any tmux call or storage creation"),
                  ("test/native/check.test.ts", "does not create unknown names or perform endpoint IO for lookup-only misses"),
                  ("test/native/talk.test.ts", "rejects invalid config and timing before storage or endpoint effects"),
                  ("test/native/talk.test.ts", "does not invent unknown targets or prepare exchanges on lookup misses"),
                  ("test/native/exchange.test.ts", "uses explicit offline identity without config or tmux and keeps reads separate from acknowledgment"),
                  ("test/native/exchange.test.ts", "rejects unknown and foreign selectors without creating identities or acknowledging another owner"),
                  ("test/native/inbox.test.ts", "keeps detach immediate and rejects missing or retired identities without another request"),
                  ("test/native/inbox.test.ts", "refuses --inbox for talk and room send, stores nothing, and still queues for an identity without a pane (#4302)"),
                  ("test/native/inbox.test.ts", "explains queueing for an identity without a pane and gives recipient pull and correlated inspection"),
                  ("test/native/digest-delivery.test.ts", "advertises only digest operations and rejects the retired feature names without creating state"),
              ],
              "e2e": [
                  ("test/e2e/notes-path.e2e.test.ts", "uses the verified saved identity implicitly and remains available explicitly offline"),
                  ("test/e2e/cli-errors.e2e.test.ts", "preserves missing target and binding conflict exits without extra output"),
                  ("test/e2e/marked-binding.e2e.test.ts", "fails clearly for no mark, invalid names, and inaccessible selected servers without fallback"),
                  ("test/e2e/marked-binding.e2e.test.ts", "uses only the invocation-selected server when two private servers have marks"),
                  ("test/e2e/smoke.e2e.test.ts", "transports a durable request and records request, submission, and summary through real tmux"),
                  ("test/e2e/durable-talk.e2e.test.ts", "submits an exact Unicode and whitespace body through the inline public reply"),
                  ("test/e2e/durable-talk.e2e.test.ts", "supports detach followed by result without confusing submission with task completion"),
                  ("test/e2e/durable-talk.e2e.test.ts", "makes a late reply available after the observer times out"),
                  ("test/e2e/durable-talk.e2e.test.ts", "asks the recipient to reply once and not to repeat the answer in its pane"),
              ],
          }
          project = "/workspace/typescript"

          def measure(report, selected):
              expected = Counter((f"{project}/{file}", title) for file, title in selected)
              found = Counter()
              results = Counter()
              unexpected = []
              for file in report["testResults"]:
                  for test in file["assertionResults"]:
                      key = (file["name"], test["title"])
                      state = test["status"]
                      if key in expected:
                          found[key] += 1
                          results[state] += 1
                      elif state not in ("skipped", "pending", "todo"):
                          unexpected.append(key)
              # The raw reporter marks cases excluded by -t as skipped. Count
              # statuses for the manifest only, retaining all selected skips.
              counts = {
                  "numTotalTests": sum(found.values()),
                  "numPassedTests": results["passed"],
                  "numFailedTests": results["failed"],
                  "numPendingTests": results["skipped"] + results["pending"],
                  "numTodoTests": results["todo"],
              }
              ok = (
                  found == expected and not unexpected
                  and counts["numTotalTests"] == len(selected)
                  and counts["numPassedTests"] == len(selected)
                  and counts["numPendingTests"] == counts["numTodoTests"] == counts["numFailedTests"] == 0
                  and report["numFailedTests"] == 0
              )
              if not ok:
                  print(f"Missing cases: {list((expected - found).elements())}; duplicate cases: {list((found - expected).elements())}; unexpected executions: {unexpected}", flush=True)
              return counts, ok

          root = Path(os.environ["RUNNER_TEMP"]) / "tmt-go-parity"
          reports = root / "reports"
          image = f"tmt-go-parity:{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          runtimes = {"native": "/workspace/rust/target/debug/tmt", "go": "/parity-bin/tmt"}
          rows = ["| Runtime | Suite | Passed | Selected |", "| --- | --- | ---: | ---: |"]
          failed = False
          for runtime, executable in runtimes.items():
              descriptor = json.dumps({"executable": executable, "args": []})
              for suite, selected in cases.items():
                  name = f"{runtime}-{suite}"
                  files = sorted({file for file, _ in selected})
                  pattern = "(?:" + "|".join(re.escape(title).replace(r"\ ", " ") for _, title in selected) + ")$"
                  log = reports / f"{name}.log"
                  print(f"Running {name}: {len(selected)} selected cases", flush=True)
                  with log.open("w") as stream:
                      result = subprocess.run([
                          "docker", "run", "--rm", "--init", "--network", "none",
                          "--mount", f"type=bind,source={root / 'bin'},target=/parity-bin,readonly",
                          "--mount", f"type=bind,source={reports},target=/parity-reports",
                          "--env", f"TMT_TEST_CLI={descriptor}", "--env", f"TMT_TEST_PEER_CLI={descriptor}",
                          "--workdir", project, image, "env", "-u", "TMUX", "-u", "TMUX_PANE",
                          "pnpm", "exec", "vp", "test", "run", "--config", f"test/{suite}/vitest.config.ts",
                          *files, "-t", pattern, "--reporter=json", f"--outputFile=/parity-reports/{name}.json",
                      ], stdout=stream, stderr=subprocess.STDOUT)
                  try:
                      report = json.loads((reports / f"{name}.json").read_text())
                      counts, ok = measure(report, selected)
                      (reports / f"{name}-selected.json").write_text(json.dumps(counts, indent=2) + "\n")
                      passed = counts["numPassedTests"]
                  except (OSError, ValueError, KeyError, TypeError) as error:
                      print(f"{name} report unavailable: {error}", flush=True)
                      passed, ok = "unavailable", False
                  rows.append(f"| {runtime} | {suite} | {passed} | {len(selected)} |")
                  if result.returncode != 0 or not ok:
                      failed = True
                      print(f"{name} failed (container exit {result.returncode})", flush=True)
                      print("\n".join(log.read_text(errors="replace").splitlines()[-40:]), flush=True)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## TypeScript executable parity\n\n" + "\n".join(rows) + "\n")
          raise SystemExit(1 if failed else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-executable-parity
          path: ${{ runner.temp }}/tmt-go-parity/reports/
          if-no-files-found: warn
